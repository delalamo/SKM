name: Import notes from comments

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-import-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  import:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.body == '/codex add-notes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write
    outputs:
      pr: ${{ steps.import.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Markdown parsers
        run: npm ci --ignore-scripts
      - uses: actions/github-script@v7
        id: import
        with:
          script: |
            const { importNotes } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github/notes.mjs`);
            await importNotes({ github, context, core });

  related:
    needs: import
    if: needs.import.outputs.pr != ''
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/codex-related-notes.yml
    with:
      pr: ${{ needs.import.outputs.pr }}
    secrets: inherit
