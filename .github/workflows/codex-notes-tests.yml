name: Test GitHub note commands

on:
  pull_request:
    paths:
      - "scripts/github/notes.mjs"
      - "tests/github/**"
      - ".github/workflows/codex-*.yml"
  push:
    branches: [main]
    paths:
      - "scripts/github/notes.mjs"
      - "tests/github/**"
      - ".github/workflows/codex-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/github/notes.test.mjs
