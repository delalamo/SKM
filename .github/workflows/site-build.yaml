name: Site build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: Site build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx quartz build

      - name: Every published URL still resolves
        run: python3 _tools/check_legacy_urls.py public _tools/data/legacy_urls.txt

      - name: Site fits GitHub Pages (1 GB limit)
        run: |
          size=$(du -sm public | cut -f1)
          echo "Site size: ${size} MB"
          if [ "$size" -gt 900 ]; then
            echo "::error::The built site is ${size} MB; GitHub Pages allows 1 GB"
            exit 1
          fi
