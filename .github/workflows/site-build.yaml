name: Site build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: Site build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx quartz build
